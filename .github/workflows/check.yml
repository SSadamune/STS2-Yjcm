name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check-repository.mjs
      - run: node tools/check-public-source.mjs
      - run: node tools/generate_cards.mjs --variant stable --check
      - run: node tools/generate_cards.mjs --variant beta --check
      - run: npm test
        working-directory: telemetry
